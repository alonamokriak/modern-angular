<div class="products-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Products</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="e.g. headphones" />
  </mat-form-field>
  <label>
    Sort by price:
    <select [ngModel]="sortOrder()" (ngModelChange)="sortOrder.set($event)">
      <option value="asc">Low to High</option>
      <option value="desc">High to Low</option>
    </select>
  </label>

  <p class="products-total">Total products: {{ products().length }}</p>
  @if (loading()) {
    <p>Loading...</p>
  } @else if (error()) {
    <p>{{ error() }}</p>
  } @else {
    <div class="products-grid">
      @for (product of sortedProducts(); track product.id) {
        <app-product-card [product]="product" (addToCart)="onAddToCart($event)" />
      } @empty {
        <div class="empty-state">
          <mat-icon>inventory_2</mat-icon>
          <p>No products match your search</p>
        </div>
      }
    </div>
  }
</div>
